<!DOCTYPE html>
<html>
<head>
    <title>Edit Items</title>
</head>
<body>

<h2>Edit Items</h2>

<form method="POST">
    <label>Name</label><br>
    <input type="text" name="name" value="{{ item[1] }}"><br><br>

    <label>Quantity</label><br>
    <input type="number" name="qty" value="{{ item[2] }}"><br><br>

    <label>Price</label><br>
    <input type="number" step="0.01" name="price" value="{{ item[3] }}"><br><br>

    <button type="submit">Update</button>
</form>

</body>
</html>
