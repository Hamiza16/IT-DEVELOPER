<!DOCTYPE html>
<html>
<head>
    <title>Inventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .low-stock {
            background-color: #f8d7da !important;
            color: #721c24;
            font-weight: bold;
        }
        .sufficient-stock {
            background-color: #d4edda !important;
            color: #155724;
            font-weight: bold;
        }
    </style>
</head>

<body class="p-4">
    <h2>Inventory</h2>
    <p>Welcome, {{ session['user'] }}</p>
    <a href="/logout" class="btn btn-danger mb-3 float-end">Logout</a>

<a href="/add" class="btn btn-success mb-3">Add New Item</a>

<div class="mb-3">
    <a href="/?sort=name" class="btn btn-outline-primary btn-sm">Sort by Name</a>
    <a href="/?sort=quantity" class="btn btn-outline-success btn-sm">Sort by Quantity</a>
    <a href="/?sort=price" class="btn btn-outline-warning btn-sm">Sort by Price</a>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
    </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                
                <td class="{% if item[2]|int <= 10 %}low-stock{% else %}sufficient-stock{% endif %}">
                    {{ item[2] }}
                </td>

                <td>{{ item[3] }}</td>
                <td>
                    <a href="/edit/{{ item[0] }}" class="btn btn-primary btn-sm">Edit</a>
                    <a href="/delete/{{ item[0] }}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
